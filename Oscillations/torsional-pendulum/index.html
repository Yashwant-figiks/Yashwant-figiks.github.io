<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torsional Pendulum Simulator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
:root{
  --navy-dark:#0a1628;
  --navy-mid:#0f1d32;
  --navy-light:#1a2d4a;
  --accent:#00d4ff;
  --accent-dim:rgba(0,212,255,0.15);
  --text-primary:#e0e6ed;
  --text-secondary:#8b9bb4;
  --card-bg:#0f1d32;
  --border-color:#1e3a5f;
  --success:#00e676;
  --warning:#ffab00;
}

body{
  background-color:var(--navy-dark);
  color:var(--text-primary);
  font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height:100vh;
}

.navbar{
  background:linear-gradient(135deg, var(--navy-mid) 0%, var(--navy-light) 100%);
  border-bottom:1px solid var(--border-color);
  box-shadow:0 2px 20px rgba(0,0,0,0.4);
}
.navbar-brand{ color:var(--accent) !important; font-weight:700; font-size:1.3rem; letter-spacing:0.5px; }
.navbar-brand i{ margin-right:10px; }

/* ---- minimal equation strip ---- */
.eq-strip{ display:flex; gap:12px; flex-wrap:wrap; }
.eq-chip{
  background:var(--card-bg); border:1px solid var(--border-color); border-radius:10px;
  padding:10px 16px; display:flex; align-items:center; gap:10px; flex:1 1 200px;
}
.eq-chip .eq-tag{ font-size:0.68rem; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary); font-weight:600; }
.eq-chip .eq-formula{ font-family:'Courier New',monospace; color:var(--accent); font-size:1.05rem; font-weight:600; }

.card{
  background-color:var(--card-bg); border:1px solid var(--border-color);
  border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.3);
}
.card-header{
  background:linear-gradient(135deg, var(--navy-light) 0%, var(--navy-mid) 100%);
  border-bottom:1px solid var(--border-color); color:var(--accent); font-weight:600;
  font-size:0.95rem; letter-spacing:0.3px; border-radius:12px 12px 0 0 !important;
  padding:12px 20px; display:flex; align-items:center; justify-content:space-between;
}
.card-header i{ margin-right:8px; }
.card-body{ padding:20px; }

.form-label{
  color:var(--text-secondary); font-size:0.85rem; font-weight:500; margin-bottom:6px;
  display:flex; justify-content:space-between; align-items:center;
}
.form-label .value-badge{
  background:var(--accent-dim); color:var(--accent); padding:2px 10px; border-radius:12px;
  font-size:0.8rem; font-weight:600; font-family:'Courier New', monospace;
}
.form-range{
  width:100%; height:6px; -webkit-appearance:none; appearance:none;
  background:var(--navy-light); border-radius:3px; outline:none; margin-bottom:16px;
}
.form-range::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
  background:var(--accent); cursor:pointer; box-shadow:0 0 10px rgba(0,212,255,0.5);
}
.form-range::-moz-range-thumb{
  width:18px; height:18px; border-radius:50%; background:var(--accent); cursor:pointer;
  border:none; box-shadow:0 0 10px rgba(0,212,255,0.5);
}

.btn-sim{
  border-radius:8px; font-weight:600; font-size:0.9rem; padding:9px 20px; letter-spacing:0.3px;
  border:none; position:relative;
  transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
}

/* 3D raised look: a solid "depth" shadow beneath + a soft glow */
.btn-start{
  background:linear-gradient(135deg,#00e676,#00c853);
  color:#04210f;
  box-shadow: 0 4px 0 #00893c, 0 6px 10px rgba(0,0,0,0.35);
}
.btn-pause{
  background:linear-gradient(135deg,#ffab00,#ff9100);
  color:#2a1900;
  box-shadow: 0 4px 0 #c46e00, 0 6px 10px rgba(0,0,0,0.35);
}
.btn-reset{
  background:linear-gradient(135deg,#ff4569,#ff1744);
  color:#fff;
  box-shadow: 0 4px 0 #b3001f, 0 6px 10px rgba(0,0,0,0.35);
}

/* hover: lift slightly higher */
.btn-sim:hover{ transform:translateY(-2px); filter:brightness(1.06); }
.btn-start:hover{ box-shadow: 0 6px 0 #00893c, 0 9px 14px rgba(0,0,0,0.4); }
.btn-pause:hover{ box-shadow: 0 6px 0 #c46e00, 0 9px 14px rgba(0,0,0,0.4); }
.btn-reset:hover{ box-shadow: 0 6px 0 #b3001f, 0 9px 14px rgba(0,0,0,0.4); }

/* pressed: flattens into the surface — no depth shadow, moves down */
.btn-sim:active,
.btn-sim.is-pressed{
  transform: translateY(4px);
  filter:brightness(0.92);
}
.btn-start:active,   .btn-start.is-pressed{   box-shadow: 0 0 0 #00893c, 0 2px 4px rgba(0,0,0,0.4) inset; }
.btn-pause:active,   .btn-pause.is-pressed{   box-shadow: 0 0 0 #c46e00, 0 2px 4px rgba(0,0,0,0.4) inset; }
.btn-reset:active,   .btn-reset.is-pressed{   box-shadow: 0 0 0 #b3001f, 0 2px 4px rgba(0,0,0,0.4) inset; }

/* "on" state — Start stays visually flat/engaged while the simulation runs */
.btn-start.is-on{
  transform: translateY(4px);
  filter:brightness(0.9);
  box-shadow: 0 0 0 #00893c, 0 2px 4px rgba(0,0,0,0.4) inset, 0 0 14px rgba(0,230,118,0.55);
}
.btn-sim:disabled{
  opacity:0.55; cursor:not-allowed; filter:none; transform:none;
}

.output-card{
  background:var(--navy-dark); border:1px solid var(--border-color); border-radius:10px;
  padding:14px; text-align:center;
}
.output-label{ color:var(--text-secondary); font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.output-value{ color:var(--accent); font-size:1.3rem; font-weight:700; font-family:'Courier New', monospace; }
.output-unit{ color:var(--text-secondary); font-size:0.8rem; margin-left:4px; }

.sim-stage{
  position:relative; border-radius:10px; overflow:hidden;
  background:radial-gradient(ellipse at center, #0f1d32 0%, #0a1628 100%);
  border:1px solid var(--border-color);
}
#simCanvas{ width:100%; height:340px; display:block; }

.watermark{
  position:absolute; bottom:10px; right:14px;
  font-weight:700; font-size:1.1rem; letter-spacing:2px;
  color:rgba(0,212,255,0.14); pointer-events:none; user-select:none;
}

.readout-bar{
  display:flex; justify-content:space-around; background:var(--navy-dark);
  border:1px solid var(--border-color); border-radius:10px; padding:12px; margin-top:12px;
}
.readout-item{ text-align:center; }
.readout-label{ color:var(--text-secondary); font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; }
.readout-value{ color:var(--success); font-size:1.1rem; font-weight:700; font-family:'Courier New', monospace; }

.chart-container{ position:relative; height:230px; width:100%; }

@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.live-indicator{ display:inline-block; width:8px; height:8px; background:var(--success); border-radius:50%; margin-right:6px; animation:pulse 1.5s infinite; }
.status-pill{ font-size:0.8rem; color:var(--text-secondary); background:var(--navy-dark); border:1px solid var(--border-color); border-radius:20px; padding:4px 12px; }

::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-track{ background:var(--navy-dark); }
::-webkit-scrollbar-thumb{ background:var(--navy-light); border-radius:4px; }

@media (max-width:768px){
  #simCanvas{ height:280px; }
  .output-value{ font-size:1.1rem; }
}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="#"><i class="bi bi-arrow-repeat"></i>Torsional Pendulum Simulator</a>
    <span class="navbar-text text-secondary d-none d-md-block">Interactive Physics Simulation</span>
  </div>
</nav>

<div class="container-fluid px-3 px-md-4 py-4">

  <!-- MINIMAL EQUATIONS -->
  <div class="eq-strip mb-4">
    <div class="eq-chip"><span class="eq-tag">Torque</span><span class="eq-formula">τ = −κθ</span></div>
    <div class="eq-chip"><span class="eq-tag">Motion</span><span class="eq-formula">I·θ̈ = −κθ</span></div>
    <div class="eq-chip"><span class="eq-tag">Period</span><span class="eq-formula">T = 2π√(I/κ)</span></div>
  </div>

  <div class="row g-4">

    <!-- SIMULATION -->
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header">
          <span><i class="bi bi-display"></i>Simulation View</span>
          <span class="status-pill"><span class="live-indicator" id="liveDot" style="display:none;"></span><span id="simStatus">Ready</span></span>
        </div>
        <div class="card-body">
          <div class="sim-stage">
            <canvas id="simCanvas"></canvas>
            <div class="watermark">YV</div>
          </div>
          <div class="readout-bar">
            <div class="readout-item"><div class="readout-label">Angle θ</div><div class="readout-value" id="readoutAngle">45.0°</div></div>
            <div class="readout-item"><div class="readout-label">Time</div><div class="readout-value" id="readoutTime">0.00 s</div></div>
            <div class="readout-item"><div class="readout-label">Angular Vel</div><div class="readout-value" id="readoutVel">0.00 rad/s</div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- PARAMETERS -->
    <div class="col-lg-4">
      <div class="card mb-4">
        <div class="card-header"><span><i class="bi bi-sliders"></i>Parameters</span></div>
        <div class="card-body">
          <label class="form-label" for="sliderI">Moment of Inertia (I)<span class="value-badge" id="valI">0.050 kg·m²</span></label>
          <input type="range" class="form-range" id="sliderI" min="0.001" max="0.500" step="0.001" value="0.050">

          <label class="form-label" for="sliderKappa">Torsional Constant (κ)<span class="value-badge" id="valKappa">0.500 N·m/rad</span></label>
          <input type="range" class="form-range" id="sliderKappa" min="0.010" max="2.000" step="0.010" value="0.500">

          <label class="form-label" for="sliderTheta0">Initial Twist Angle (θ₀)<span class="value-badge" id="valTheta0">45°</span></label>
          <input type="range" class="form-range" id="sliderTheta0" min="-180" max="180" step="1" value="45">

          <label class="form-label" for="sliderDamping">Damping Coefficient (b)<span class="value-badge" id="valDamping">0.000</span></label>
          <input type="range" class="form-range" id="sliderDamping" min="0.000" max="0.100" step="0.001" value="0.000">

          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-sim btn-start flex-fill" id="btnStart"><i class="bi bi-play-fill"></i> Start</button>
            <button class="btn btn-sim btn-pause flex-fill" id="btnPause"><i class="bi bi-pause-fill"></i> Pause</button>
            <button class="btn btn-sim btn-reset flex-fill" id="btnReset"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span><i class="bi bi-calculator"></i>Outputs</span></div>
        <div class="card-body">
          <div class="row g-2">
            <div class="col-6"><div class="output-card"><div class="output-label">ω</div><div><span class="output-value" id="outOmega">3.16</span><span class="output-unit">rad/s</span></div></div></div>
            <div class="col-6"><div class="output-card"><div class="output-label">T</div><div><span class="output-value" id="outPeriod">1.99</span><span class="output-unit">s</span></div></div></div>
            <div class="col-6"><div class="output-card"><div class="output-label">f</div><div><span class="output-value" id="outFreq">0.50</span><span class="output-unit">Hz</span></div></div></div>
            <div class="col-6"><div class="output-card"><div class="output-label">θ max</div><div><span class="output-value" id="outMaxAngle">45.0</span><span class="output-unit">°</span></div></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- GRAPH — full width, below -->
    <div class="col-12">
      <div class="card">
        <div class="card-header"><span><i class="bi bi-graph-up"></i>Angle vs Time Graph</span></div>
        <div class="card-body">
          <div class="chart-container"><canvas id="graphCanvas"></canvas></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/* ============================================
   STATE
   ============================================ */
let I = 0.050, kappa = 0.500, theta0 = 45, damping = 0.000;
let time = 0, angle = 0, angularVel = 0;
let isRunning = false, animId = null, lastTimestamp = 0;
const timeWindow = 20;
let graphData = [];

const sliderI = document.getElementById('sliderI');
const sliderKappa = document.getElementById('sliderKappa');
const sliderTheta0 = document.getElementById('sliderTheta0');
const sliderDamping = document.getElementById('sliderDamping');
const valI = document.getElementById('valI');
const valKappa = document.getElementById('valKappa');
const valTheta0 = document.getElementById('valTheta0');
const valDamping = document.getElementById('valDamping');
const outOmega = document.getElementById('outOmega');
const outPeriod = document.getElementById('outPeriod');
const outFreq = document.getElementById('outFreq');
const outMaxAngle = document.getElementById('outMaxAngle');
const readoutAngle = document.getElementById('readoutAngle');
const readoutTime = document.getElementById('readoutTime');
const readoutVel = document.getElementById('readoutVel');
const simStatus = document.getElementById('simStatus');
const liveDot = document.getElementById('liveDot');
const btnStart = document.getElementById('btnStart');
const btnPause = document.getElementById('btnPause');
const btnReset = document.getElementById('btnReset');
const simCanvas = document.getElementById('simCanvas');
const simCtx = simCanvas.getContext('2d');
const graphCanvas = document.getElementById('graphCanvas');

/* ============================================
   CHART
   ============================================ */
Chart.defaults.color = '#8b9bb4';
Chart.defaults.borderColor = '#1e3a5f';

const chart = new Chart(graphCanvas, {
  type:'line',
  data:{ datasets:[
    { label:'θ(t)', data:[], borderColor:'#00d4ff', backgroundColor:'rgba(0,212,255,0.1)', borderWidth:2, pointRadius:0, fill:true, tension:0.4 },
    { label:'Envelope', data:[], borderColor:'rgba(255,171,0,0.5)', borderWidth:1, borderDash:[5,5], pointRadius:0, fill:false, tension:0.4 },
    { label:'-Envelope', data:[], borderColor:'rgba(255,171,0,0.5)', borderWidth:1, borderDash:[5,5], pointRadius:0, fill:false, tension:0.4 }
  ]},
  options:{
    responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{ mode:'index', intersect:false },
    plugins:{
      legend:{ display:true, labels:{ usePointStyle:true, boxWidth:8 } },
      tooltip:{ backgroundColor:'#0a1628', titleColor:'#00d4ff', bodyColor:'#e0e6ed', borderColor:'#1e3a5f', borderWidth:1 }
    },
    scales:{
      x:{ type:'linear', title:{ display:true, text:'Time (s)', color:'#8b9bb4' }, grid:{ color:'#1e3a5f' }, min:0, max:timeWindow },
      y:{ title:{ display:true, text:'Angle (°)', color:'#8b9bb4' }, grid:{ color:'#1e3a5f' }, suggestedMin:-180, suggestedMax:180 }
    }
  }
});

/* ============================================
   INIT
   ============================================ */
function init(){
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  [sliderI, sliderKappa, sliderTheta0, sliderDamping].forEach(s => s.addEventListener('input', onParamChange));
  btnStart.addEventListener('click', startSimulation);
  btnPause.addEventListener('click', pauseSimulation);
  btnReset.addEventListener('click', resetSimulation);
  onParamChange();
  resetSimulation();
}

function resizeCanvas(){
  const rect = simCanvas.parentElement.getBoundingClientRect();
  simCanvas.width = rect.width;
  simCanvas.height = 340;
  if(!isRunning) drawSimulation();
}

/* ============================================
   PARAMS
   ============================================ */
function onParamChange(){
  I = parseFloat(sliderI.value);
  kappa = parseFloat(sliderKappa.value);
  theta0 = parseFloat(sliderTheta0.value);
  damping = parseFloat(sliderDamping.value);

  valI.textContent = I.toFixed(3) + ' kg·m²';
  valKappa.textContent = kappa.toFixed(3) + ' N·m/rad';
  valTheta0.textContent = theta0 + '°';
  valDamping.textContent = damping.toFixed(3);

  const omega = Math.sqrt(kappa / I);
  const period = 2 * Math.PI / omega;
  const freq = 1 / period;

  outOmega.textContent = omega.toFixed(2);
  outPeriod.textContent = period.toFixed(2);
  outFreq.textContent = freq.toFixed(2);
  outMaxAngle.textContent = Math.abs(theta0).toFixed(1);

  if(!isRunning){
    angle = theta0 * Math.PI / 180;
    readoutAngle.textContent = theta0.toFixed(1) + '°';
    drawSimulation();
  }
}

/* ============================================
   CONTROL
   ============================================ */
function startSimulation(){
  if(isRunning) return;
  isRunning = true;
  lastTimestamp = performance.now();
  simStatus.textContent = 'Running';
  liveDot.style.display = 'inline-block';
  btnStart.classList.add('is-on');
  btnPause.classList.remove('is-on');
  animId = requestAnimationFrame(animationLoop);
}
function pauseSimulation(){
  isRunning = false;
  if(animId) cancelAnimationFrame(animId);
  simStatus.textContent = 'Paused';
  liveDot.style.display = 'none';
  btnStart.classList.remove('is-on');
}
function resetSimulation(){
  pauseSimulation();
  time = 0;
  angle = theta0 * Math.PI / 180;
  angularVel = 0;
  graphData = [];
  chart.data.datasets[0].data = [];
  chart.data.datasets[1].data = [];
  chart.data.datasets[2].data = [];
  chart.update('none');
  simStatus.textContent = 'Ready';
  updateReadouts();
  drawSimulation();
}

/* ============================================
   ANIMATION LOOP
   ============================================ */
function animationLoop(timestamp){
  if(!isRunning) return;
  const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
  lastTimestamp = timestamp;
  updatePhysics(dt);
  updateGraph();
  drawSimulation();
  updateReadouts();
  chart.update('none');
  animId = requestAnimationFrame(animationLoop);
}

/* ============================================
   PHYSICS (analytical solution)
   ============================================ */
function updatePhysics(dt){
  const theta0Rad = theta0 * Math.PI / 180;
  const omega0 = Math.sqrt(kappa / I);
  const gamma = damping / (2 * I);

  if(damping > 0 && gamma < omega0){
    const omegaD = Math.sqrt(omega0*omega0 - gamma*gamma);
    const env = Math.exp(-gamma * time);
    angle = theta0Rad * env * Math.cos(omegaD * time);
    angularVel = -theta0Rad * env * (gamma*Math.cos(omegaD*time) + omegaD*Math.sin(omegaD*time));
  } else if(damping > 0 && gamma >= omega0){
    angle = theta0Rad * Math.exp(-gamma * time);
    angularVel = -theta0Rad * gamma * Math.exp(-gamma * time);
  } else {
    angle = theta0Rad * Math.cos(omega0 * time);
    angularVel = -theta0Rad * omega0 * Math.sin(omega0 * time);
  }
  time += dt;
}

/* ============================================
   GRAPH DATA
   ============================================ */
function updateGraph(){
  const angleDeg = angle * 180 / Math.PI;
  graphData.push({ t:time, theta:angleDeg });
  const cutoffTime = Math.max(0, time - timeWindow);
  while(graphData.length > 0 && graphData[0].t < cutoffTime) graphData.shift();

  chart.data.datasets[0].data = graphData.map(p => ({ x:p.t, y:p.theta }));

  if(damping > 0){
    const gamma = damping / (2*I);
    const theta0Rad = Math.abs(theta0 * Math.PI / 180);
    const envData = [], negEnvData = [];
    for(const p of graphData){
      const env = theta0Rad * Math.exp(-gamma * p.t) * 180 / Math.PI;
      envData.push({ x:p.t, y:env });
      negEnvData.push({ x:p.t, y:-env });
    }
    chart.data.datasets[1].data = envData;
    chart.data.datasets[2].data = negEnvData;
  } else {
    chart.data.datasets[1].data = [];
    chart.data.datasets[2].data = [];
  }

  chart.options.scales.x.min = cutoffTime;
  chart.options.scales.x.max = cutoffTime + timeWindow;
}

/* ============================================
   RENDERING — original disc, correctly attached to wire
   ============================================ */
function drawSimulation(){
  const ctx = simCtx;
  const w = simCanvas.width, h = simCanvas.height;
  const cx = w / 2, cy = h / 2;

  ctx.clearRect(0, 0, w, h);
  drawGrid(ctx, w, h);

  const discRadius = Math.min(w, h) * 0.28;
  const angleDeg = angle * 180 / Math.PI;

  /* wire: from support straight down to the disc's exact centre */
  ctx.save();
  ctx.strokeStyle = '#4a6fa5';
  ctx.lineWidth = 2;
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(cx, 20);
  ctx.lineTo(cx, cy);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  /* support bracket */
  ctx.fillStyle = '#6c8ebf';
  ctx.fillRect(cx - 30, 15, 60, 10);
  ctx.fillStyle = '#8b9bb4';
  ctx.fillRect(cx - 40, 10, 80, 8);

  /* disc, centred exactly where the wire ends */
  drawDisc(ctx, cx, cy, discRadius, angleDeg);

  /* pivot point marker */
  ctx.fillStyle = '#00d4ff';
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI*2);
  ctx.shadowBlur = 10; ctx.shadowColor = '#00d4ff';
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawGrid(ctx, w, h){
  ctx.strokeStyle = 'rgba(30,58,95,0.3)';
  ctx.lineWidth = 0.5;
  const step = 30;
  for(let x=0;x<w;x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  for(let y=0;y<h;y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
}

/**
 * Draw the disc with 3D perspective (elliptical), rotation, and both
 * the target amplitude (θ0) and live angle (θ) labelled on the disc itself.
 */
function drawDisc(ctx, cx, cy, r, angleDeg){
  const tilt = 0.25;
  const ry = r * tilt;

  ctx.save();
  ctx.translate(cx, cy);

  /* shadow */
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(3, 5, r, ry, 0, 0, Math.PI*2);
  ctx.fill();

  /* body */
  const grad = ctx.createRadialGradient(-r*0.2, -ry*0.3, r*0.1, 0, 0, r);
  grad.addColorStop(0, '#1e3a5f');
  grad.addColorStop(0.5, '#0f1d32');
  grad.addColorStop(1, '#0a1628');
  ctx.fillStyle = grad;
  ctx.strokeStyle = '#00d4ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, r, ry, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  /* radial spokes */
  ctx.strokeStyle = 'rgba(0,212,255,0.3)';
  ctx.lineWidth = 1;
  for(let i=0;i<8;i++){
    const a = (angleDeg + i*45) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(r*Math.cos(a), ry*Math.sin(a));
    ctx.stroke();
  }

  /* θ0 marker (static, target amplitude) */
  const theta0Rad = theta0 * Math.PI / 180;
  ctx.strokeStyle = 'rgba(255,171,0,0.6)';
  ctx.lineWidth = 2;
  ctx.setLineDash([3,3]);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(r*Math.cos(theta0Rad), ry*Math.sin(theta0Rad));
  ctx.stroke();
  ctx.setLineDash([]);

  /* live θ marker */
  ctx.strokeStyle = '#00d4ff';
  ctx.lineWidth = 3;
  const markerAngle = angleDeg * Math.PI / 180;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(r*Math.cos(markerAngle), ry*Math.sin(markerAngle));
  ctx.stroke();

  ctx.fillStyle = '#ff4569';
  ctx.beginPath();
  ctx.arc(r*Math.cos(markerAngle), ry*Math.sin(markerAngle), 6, 0, Math.PI*2);
  ctx.shadowBlur = 8; ctx.shadowColor = '#ff4569';
  ctx.fill();
  ctx.shadowBlur = 0;

  /* concentric rings for depth */
  ctx.strokeStyle = 'rgba(0,212,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(0,0, r*0.6, ry*0.6, 0, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0,0, r*0.3, ry*0.3, 0, 0, Math.PI*2); ctx.stroke();

  /* --- angle labels, placed on the disc --- */
  ctx.font = "600 12px 'Courier New', monospace";
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffab00';
  ctx.fillText('θ₀ = ' + Math.abs(theta0).toFixed(0) + '°', 0, -ry - 14);
  ctx.fillStyle = '#00d4ff';
  ctx.fillText('θ = ' + angleDeg.toFixed(1) + '°', 0, -ry - 30);

  ctx.restore();
}

/* ============================================
   READOUTS
   ============================================ */
function updateReadouts(){
  const angleDeg = angle * 180 / Math.PI;
  readoutAngle.textContent = angleDeg.toFixed(1) + '°';
  readoutTime.textContent = time.toFixed(2) + ' s';
  readoutVel.textContent = angularVel.toFixed(2) + ' rad/s';
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
