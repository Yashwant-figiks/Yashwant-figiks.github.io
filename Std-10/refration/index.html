<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snell's Law Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f3f5f9;
    --panel: #ffffff;
    --border: #dde3ec;
    --accent1: #e8551e;
    --accent2: #1478d4;
    --accent3: #3f9e0d;
    --text: #1c2430;
    --muted: #6b7484;
    --tir: #e01e5a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 20px;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  h1 span { color: var(--accent1); }

  .layout {
    display: flex;
    gap: 20px;
    width: 100%;
    max-width: 900px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 10px rgba(30, 40, 60, 0.06);
  }

  /* Controls */
  .controls {
    flex: 0 0 260px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .ctrl-group label {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .ctrl-group label span { color: var(--text); font-weight: 700; }

  input[type=range] {
    width: 100%;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range].n1-slider { background: linear-gradient(to right, var(--accent1), #ff9a6b); }
  input[type=range].n2-slider { background: linear-gradient(to right, var(--accent2), #6bc4ff); }
  input[type=range].angle-slider { background: linear-gradient(to right, var(--accent3), #8fd94f); }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #b8c2d0;
    box-shadow: 0 1px 4px rgba(30, 40, 60, 0.25);
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
  }

  /* Results */
  .results { display: flex; flex-direction: column; gap: 10px; }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.82rem;
  }
  .result-row .lbl { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
  .result-row .val { font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; }
  .val.orange { color: var(--accent1); }
  .val.blue   { color: var(--accent2); }
  .val.green  { color: var(--accent3); }
  .val.red    { color: var(--tir); }

  .snell-box {
    background: #f7f9fc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.7;
  }
  .snell-box .eq { color: var(--text); }

  .tir-banner {
    background: rgba(224,30,90,0.08);
    border: 1px solid var(--tir);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.8rem;
    color: var(--tir);
    font-weight: 700;
    text-align: center;
    display: none;
    letter-spacing: 0.5px;
  }
  .tir-banner.visible { display: block; }

  /* Canvas panel */
  .canvas-wrap {
    flex: 1 1 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 0;
    overflow: hidden;
    min-width: 300px;
  }

  canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
  }
</style>
</head>
<body>

<h1>🔦 Snell's Law — <span>Refraction Explorer</span></h1>

<div class="layout">
  <!-- Controls Panel -->
  <div class="panel controls">

    <div class="ctrl-group">
      <label>Incident Angle <span id="lbl-angle">45</span>°</label>
      <input type="range" class="angle-slider" id="slider-angle" min="0" max="90" value="45">
    </div>

    <hr class="divider">

    <div class="ctrl-group">
      <label>n₁ — Medium 1 <span id="lbl-n1">1.00</span></label>
      <input type="range" class="n1-slider" id="slider-n1" min="100" max="300" value="100">
    </div>

    <div class="ctrl-group">
      <label>n₂ — Medium 2 <span id="lbl-n2">1.50</span></label>
      <input type="range" class="n2-slider" id="slider-n2" min="100" max="300" value="150">
    </div>

    <hr class="divider">

    <div class="results">
      <div class="result-row">
        <span class="lbl">Incident angle θ₁</span>
        <span class="val orange" id="res-i">45.0°</span>
      </div>
      <div class="result-row">
        <span class="lbl">Refracted angle θ₂</span>
        <span class="val blue" id="res-r">28.1°</span>
      </div>
      <div class="result-row">
        <span class="lbl">Critical angle θ_c</span>
        <span class="val green" id="res-c">—</span>
      </div>
    </div>

    <div class="tir-banner" id="tir-banner">⚠ Total Internal Reflection</div>

    <div class="snell-box">
      <div>Snell's Law:</div>
      <div class="eq" id="snell-eq">n₁ sin θ₁ = n₂ sin θ₂</div>
      <div class="eq" id="snell-num">1.00 × sin(45°) = 1.50 × sin(28.1°)</div>
    </div>

  </div>

  <!-- Canvas Panel -->
  <div class="panel canvas-wrap">
    <canvas id="sim" width="520" height="440"></canvas>
  </div>
</div>

<script>
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');

  const sliderAngle = document.getElementById('slider-angle');
  const sliderN1    = document.getElementById('slider-n1');
  const sliderN2    = document.getElementById('slider-n2');

  function toRad(d) { return d * Math.PI / 180; }
  function toDeg(r) { return r * 180 / Math.PI; }

  function getValues() {
    return {
      angle: parseFloat(sliderAngle.value),
      n1: parseFloat(sliderN1.value) / 100,
      n2: parseFloat(sliderN2.value) / 100,
    };
  }

  // Animated (eased) state — rays glide toward the slider values
  const cur = { angle: 45, n1: 1.00, n2: 1.50 };
  const EASE = 0.12;

  // ---- Side panel (updates instantly from sliders) ----
  function updatePanel() {
    const { angle, n1, n2 } = getValues();
    const rad = toRad(angle);

    document.getElementById('lbl-angle').textContent = angle;
    document.getElementById('lbl-n1').textContent = n1.toFixed(2);
    document.getElementById('lbl-n2').textContent = n2.toFixed(2);
    document.getElementById('res-i').textContent = angle.toFixed(1) + '°';

    const sinR = (n1 / n2) * Math.sin(rad);
    const isTIR = sinR > 1;

    let critStr = '—';
    if (n1 > n2) critStr = toDeg(Math.asin(n2 / n1)).toFixed(1) + '°';
    document.getElementById('res-c').textContent = critStr;

    document.getElementById('tir-banner').classList.toggle('visible', isTIR);

    let refractedDeg = 0;
    if (!isTIR) {
      refractedDeg = toDeg(Math.asin(sinR));
      document.getElementById('res-r').textContent = refractedDeg.toFixed(1) + '°';
      document.getElementById('res-r').className = 'val blue';
    } else {
      document.getElementById('res-r').textContent = 'TIR';
      document.getElementById('res-r').className = 'val red';
    }

    document.getElementById('snell-num').textContent = isTIR
      ? `${n1.toFixed(2)} × sin(${angle}°) > ${n2.toFixed(2)} → TIR`
      : `${n1.toFixed(2)} × sin(${angle}°) = ${n2.toFixed(2)} × sin(${refractedDeg.toFixed(1)}°)`;
  }

  // ---- Moving light pulses along a ray segment ----
  function drawPulses(x1, y1, x2, y2, color, time, speed) {
    const len = Math.hypot(x2 - x1, y2 - y1);
    const spacing = 55;                 // px between pulses
    const offset = (time * speed) % spacing;
    for (let d = offset; d < len; d += spacing) {
      const t = d / len;
      const px = x1 + (x2 - x1) * t;
      const py = y1 + (y2 - y1) * t;
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      ctx.arc(px, py, 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  // ---- Canvas render (uses eased values) ----
  function draw(time) {
    const { angle, n1, n2 } = cur;
    const rad = toRad(angle);

    const sinR = (n1 / n2) * Math.sin(rad);
    const isTIR = sinR > 1;
    let refractedRad = 0;
    if (!isTIR) refractedRad = Math.asin(Math.min(sinR, 1));

    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;

    // Medium tints (deeper n = richer color) — light mode
    const t1 = Math.min((n1 - 1) / 2, 1);
    const t2 = Math.min((n2 - 1) / 2, 1);

    ctx.fillStyle = '#fafbfd';
    ctx.fillRect(0, 0, W, cy);
    ctx.fillStyle = `rgba(232,85,30,${0.03 + t1 * 0.10})`;
    ctx.fillRect(0, 0, W, cy);

    ctx.fillStyle = '#f4f7fb';
    ctx.fillRect(0, cy, W, cy);
    ctx.fillStyle = `rgba(20,120,212,${0.03 + t2 * 0.10})`;
    ctx.fillRect(0, cy, W, cy);

    // Boundary
    ctx.beginPath();
    ctx.strokeStyle = '#aab4c4';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.moveTo(0, cy);
    ctx.lineTo(W, cy);
    ctx.stroke();
    ctx.setLineDash([]);

    // Normal
    ctx.beginPath();
    ctx.setLineDash([4, 5]);
    ctx.strokeStyle = '#98a2b3';
    ctx.lineWidth = 1;
    ctx.moveTo(cx, 16);
    ctx.lineTo(cx, H - 16);
    ctx.stroke();
    ctx.setLineDash([]);

    const rayLen = 170;
    const SPEED = 0.09; // pulse travel speed (px per ms)

    // Incident ray
    const ix = cx - rayLen * Math.sin(rad);
    const iy = cy - rayLen * Math.cos(rad);
    ctx.beginPath();
    ctx.strokeStyle = '#e8551e';
    ctx.lineWidth = 2.5;
    ctx.moveTo(ix, iy);
    ctx.lineTo(cx, cy);
    ctx.stroke();
    drawPulses(ix, iy, cx, cy, '#e8551e', time, SPEED);
    drawArrow(ix, iy, cx, cy, '#e8551e', true);

    if (!isTIR) {
      // Refracted ray
      const rx = cx + rayLen * Math.sin(refractedRad);
      const ry = cy + rayLen * Math.cos(refractedRad);
      ctx.beginPath();
      ctx.strokeStyle = '#1478d4';
      ctx.lineWidth = 2.5;
      ctx.moveTo(cx, cy);
      ctx.lineTo(rx, ry);
      ctx.stroke();
      drawPulses(cx, cy, rx, ry, '#1478d4', time, SPEED);
      drawArrow(cx, cy, rx, ry, '#1478d4', false);

      drawArc(cx, cy, 36, -Math.PI/2 - rad, -Math.PI/2, '#e8551e', 'θ₁');
      if (toDeg(refractedRad) > 0.5)
        drawArc(cx, cy, 44, Math.PI/2, Math.PI/2 - refractedRad, '#1478d4', 'θ₂');
    } else {
      // TIR: reflected ray
      const relX = cx + rayLen * Math.sin(rad);
      const relY = cy - rayLen * Math.cos(rad);
      ctx.beginPath();
      ctx.strokeStyle = '#e01e5a';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 4]);
      ctx.moveTo(cx, cy);
      ctx.lineTo(relX, relY);
      ctx.stroke();
      ctx.setLineDash([]);
      drawPulses(cx, cy, relX, relY, '#e01e5a', time, SPEED);
      drawArrow(cx, cy, relX, relY, '#e01e5a', false);
      drawArc(cx, cy, 36, -Math.PI/2 - rad, -Math.PI/2, '#e8551e', 'θ₁');
      drawArc(cx, cy, 44, -Math.PI/2, -Math.PI/2 + rad, '#e01e5a', 'θᵣ');
    }

    // Medium labels
    ctx.font = 'bold 12px "JetBrains Mono", monospace';
    ctx.fillStyle = `rgba(232,85,30,${0.55 + t1 * 0.45})`;
    ctx.fillText(`n₁ = ${n1.toFixed(2)}`, 14, 24);

    ctx.fillStyle = `rgba(20,120,212,${0.55 + t2 * 0.45})`;
    ctx.fillText(`n₂ = ${n2.toFixed(2)}`, 14, H - 12);

    // Normal label
    ctx.fillStyle = '#98a2b3';
    ctx.font = '11px "JetBrains Mono"';
    ctx.fillText('normal', cx + 6, 28);
  }

  function drawArrow(x1, y1, x2, y2, color, atEnd) {
    const headLen = 10;
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const px = atEnd ? x2 : (x1 + x2) / 2;
    const py = atEnd ? y2 : (y1 + y2) / 2;
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.moveTo(px, py);
    ctx.lineTo(px - headLen * Math.cos(angle - Math.PI/6), py - headLen * Math.sin(angle - Math.PI/6));
    ctx.lineTo(px - headLen * Math.cos(angle + Math.PI/6), py - headLen * Math.sin(angle + Math.PI/6));
    ctx.closePath();
    ctx.fill();
  }

  function drawArc(cx, cy, r, start, end, color, label) {
    const ccw = start > end;
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.arc(cx, cy, r, start, end, ccw);
    ctx.stroke();
    const mid = (start + end) / 2;
    const lx = cx + (r + 14) * Math.cos(mid);
    const ly = cy + (r + 14) * Math.sin(mid);
    ctx.fillStyle = color;
    ctx.font = 'bold 12px "JetBrains Mono"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, lx, ly);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // ---- Animation loop ----
  function animate(time) {
    const target = getValues();
    cur.angle += (target.angle - cur.angle) * EASE;
    cur.n1    += (target.n1    - cur.n1)    * EASE;
    cur.n2    += (target.n2    - cur.n2)    * EASE;
    // Snap when close enough to avoid endless drift
    if (Math.abs(target.angle - cur.angle) < 0.01) cur.angle = target.angle;
    if (Math.abs(target.n1 - cur.n1) < 0.001) cur.n1 = target.n1;
    if (Math.abs(target.n2 - cur.n2) < 0.001) cur.n2 = target.n2;
    draw(time);
    requestAnimationFrame(animate);
  }

  [sliderAngle, sliderN1, sliderN2].forEach(s => s.addEventListener('input', updatePanel));
  updatePanel();
  requestAnimationFrame(animate);
</script>
</body>
</html>
